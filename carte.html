<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Carte de Joueur — Sphère de l'Intendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Noto+Sans+JP:wght@200;300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.wrap{max-width:640px;margin:0 auto;padding:60px 20px 80px;position:relative;z-index:2;}
.unlock-panel{max-width:400px;margin:80px auto;background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--gold);
  border-radius:14px;padding:36px 32px;text-align:center;animation:fadeUp .5s ease-out both;}
.card-visual{position:relative;background:linear-gradient(150deg,#160a02,#0a0402 60%,#1a0505);border:1px solid rgba(201,162,39,.3);
  border-radius:16px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(201,162,39,.15);overflow:hidden;animation:fadeUp .5s ease-out both;}
.card-visual::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(201,162,39,.1),transparent 60%);pointer-events:none;}
.card-visual::after{content:'';position:absolute;top:0;left:-40%;width:30%;height:100%;pointer-events:none;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-20deg);
  animation:cardShimmer 6s ease-in-out infinite;}
@keyframes cardShimmer{0%,80%,100%{left:-40%;}40%{left:130%;}}
@media(prefers-reduced-motion:reduce){.card-visual::after{animation:none!important;}}
.cv-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.cv-org{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:3px;color:rgba(201,162,39,.55);text-transform:uppercase;}
.cv-status{font-size:.55rem;}
.cv-name{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--gold2);letter-spacing:2px;margin-top:24px;position:relative;z-index:1;}
.cv-steam{font-size:.65rem;color:var(--text-muted);margin-top:4px;position:relative;z-index:1;}
.cv-balance-row{display:flex;align-items:baseline;gap:10px;margin-top:22px;position:relative;z-index:1;}
.cv-balance{font-family:'Cinzel',serif;font-size:2.6rem;font-weight:900;color:var(--gold2);text-shadow:0 0 26px rgba(240,208,96,.45);}
.cv-expire{font-size:.6rem;color:var(--text-muted);margin-top:10px;position:relative;z-index:1;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:26px;}
.game-tile{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--gc,var(--gold));border-radius:10px;
  padding:20px 14px;text-align:center;transition:.25s;}
.game-tile:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.6);border-color:var(--gc,var(--gold));}
.game-tile .gi{font-size:1.8rem;margin-bottom:8px;}
.game-tile .gn{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:1px;color:var(--text);}
</style>
</head>
<body>
<div class="bg-fx"></div>
<canvas id="embers"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div class="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"></div>
<div id="toast-container"></div>

<div class="wrap">
  <div id="unlockView"></div>
  <div id="cardView" style="display:none"></div>
</div>

<script type="module">
import { initFx } from "./assets/js/fx.js";
import { initUiFx, staggerIn, countUp } from "./assets/js/uiFx.js";
import { toast } from "./assets/js/toast.js";
import { unlockCard, getPlayerSession, clearPlayerSession } from "./assets/js/playerSession.js";
import { getCard, cardTransactions, isExpired, msUntilExpiration, isSuspended } from "./assets/js/cards.js";
import { tokenDisplayHTML, formatYen, tokensToYen } from "./assets/js/economy.js";
import { mountJackpotWidget } from "./assets/js/jackpot.js";
import { rankProgressHTML } from "./assets/js/ranks.js";

initFx();
initUiFx();

if(new URLSearchParams(location.search).get("expired") === "1"){
  toast("Session expirée — déverrouille à nouveau ta carte.", "warn");
}

const unlockView = document.getElementById("unlockView");
const cardView = document.getElementById("cardView");

function renderUnlock(){
  cardView.style.display = "none";
  unlockView.style.display = "block";
  unlockView.innerHTML = `
    <div class="unlock-panel">
      <div style="font-size:1.3rem;color:rgba(201,162,39,.7);margin-bottom:10px;">🀄</div>
      <div class="page-title" style="font-size:1rem;padding-bottom:6px;display:block;">Ma Carte de Joueur</div>
      <div class="page-sub" style="margin-bottom:20px;">Entre ton Steam ID et ton code PIN</div>
      <div class="form-group"><label class="form-label">Steam ID 64</label><input class="form-input" id="uSteamId" placeholder="76561198XXXXXXXXX"></div>
      <div class="form-group"><label class="form-label">Code PIN</label><input class="form-input" id="uPin" placeholder="Fourni par l'Hôte" style="text-align:center;letter-spacing:3px;"></div>
      <button class="btn btn-solid btn-block btn-lg" id="btnUnlock">Déverrouiller</button>
      <a href="index.html" style="display:block;margin-top:16px;font-size:.6rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;">← Retour</a>
    </div>`;
  document.getElementById("btnUnlock").addEventListener("click", async () => {
    const steamId = document.getElementById("uSteamId").value.trim();
    const pin = document.getElementById("uPin").value.trim();
    if(!steamId || !pin) return toast("Steam ID et PIN requis.", "warn");
    const card = await unlockCard(steamId, pin);
    if(!card) return toast("Steam ID ou PIN incorrect.", "error");
    toast("Carte déverrouillée.", "success");
    await renderCard();
  });
}

/* Statistiques personnelles calculées depuis l'historique (jusqu'à 500
   transactions les plus récentes — au-delà, pas de vraie base "à vie",
   mais largement suffisant pour un casino qui n'ouvre que par événements).
   "mise" couvre Roulette/Blackjack/Crash (une mise = une manche jouée) ;
   Pile ou Face/Dés n'enregistrent qu'un seul mouvement net par manche
   (gain ou perte), donc comptés séparément pour ne pas fausser le total. */
const GAME_NAMES = { coinflip:'Pile ou Face', dice:'Lancer de Dés', roulette:'Roulette', blackjack:'Blackjack', crash:'Ascension Fulgurante' };
function renderStats(txs){
  const miseTxs = txs.filter(t => t.type === 'mise' && t.gameId && t.gameId !== 'jackpot');
  const netGameTxs = txs.filter(t => (t.type === 'gain' || t.type === 'perte') && (t.gameId === 'coinflip' || t.gameId === 'dice'));
  const gains = txs.filter(t => t.type === 'gain' && t.gameId && t.gameId !== 'jackpot');
  const totalRounds = miseTxs.length + netGameTxs.length;
  const winRate = totalRounds > 0 ? Math.round((gains.length / totalRounds) * 100) : null;
  const biggestWin = gains.length ? Math.max(...gains.map(t => t.amount)) : 0;

  const gameCounts = {};
  [...miseTxs, ...netGameTxs].forEach(t => { gameCounts[t.gameId] = (gameCounts[t.gameId] || 0) + 1; });
  const favGameId = Object.entries(gameCounts).sort((a, b) => b[1] - a[1])[0]?.[0];

  document.getElementById("statBiggestWin").textContent = biggestWin.toLocaleString('fr-FR');
  document.getElementById("statWinRate").textContent = winRate !== null ? `${winRate}%` : '—';
  document.getElementById("statFavGame").textContent = favGameId ? (GAME_NAMES[favGameId] || favGameId) : '—';
}

async function renderCard(){
  const session = getPlayerSession();
  if(!session) return renderUnlock();
  const card = await getCard(session.id);
  if(!card) return renderUnlock();

  unlockView.style.display = "none";
  cardView.style.display = "block";
  mountJackpotWidget({ canSubscribe: true });
  const expired = isExpired(card);
  const suspended = isSuspended(card);
  const hoursLeft = expired ? 0 : Math.floor(msUntilExpiration(card) / 3600000);
  const locked = expired || suspended;
  const statusLabel = suspended ? "Carte Suspendue" : (expired ? "Carte Expirée" : "Active");
  const statusClass = suspended ? "badge-suspended" : (expired ? "badge-expired" : "badge-active");

  cardView.innerHTML = `
    <div class="card-visual">
      <div class="cv-top">
        <div class="cv-org">Sphère de l'Intendance</div>
        <div class="cv-status badge ${statusClass}">${statusLabel}</div>
      </div>
      <div class="cv-name">${card.playerName}</div>
      <div class="cv-steam">${card.steamId}</div>
      <div class="cv-balance-row"><div class="cv-balance">${tokenDisplayHTML(card.balance)}</div></div>
      <div class="cv-expire">${suspended ? "Carte suspendue par l'Hôte — tes jetons sont gelés en attendant la réactivation." : (expired ? "Aucune activité depuis plus de 24h — repasse à la caisse pour la réactiver." : `Expire dans ${hoursLeft}h sans activité.`)}</div>
      <div style="margin-top:20px;position:relative;z-index:1;">${rankProgressHTML(card.totalWagered)}</div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <div class="panel-title">📊 Mes Statistiques</div>
      <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));">
        <div class="stat-card"><div class="stat-val" id="statTotalWagered">0</div><div class="stat-label">Total Misé</div></div>
        <div class="stat-card"><div class="stat-val" id="statBiggestWin">0</div><div class="stat-label">Plus Gros Gain</div></div>
        <div class="stat-card"><div class="stat-val" id="statWinRate">—</div><div class="stat-label">Taux de Victoire</div></div>
        <div class="stat-card"><div class="stat-val" id="statFavGame" style="font-size:1rem;">—</div><div class="stat-label">Jeu Favori</div></div>
      </div>
    </div>

    <div class="page-header" style="margin-top:32px;">
      <div class="panel-title" style="border:none;padding:0;margin:0;">🎲 Jeux Disponibles</div>
      <button class="btn btn-ghost btn-sm" id="btnLock">Verrouiller la carte</button>
    </div>
    <div class="games-grid">
      ${[
        { href:"games/coinflip.html", gc:"#c9a227", icon:"🪙", name:"Pile ou Face" },
        { href:"games/dice.html", gc:"#1fae7c", icon:"🎲", name:"Lancer de Dés" },
        { href:"games/roulette.html?table=1", gc:"#b3121a", icon:"🎡", name:"Roulette — Table 1" },
        { href:"games/roulette.html?table=2", gc:"#b3121a", icon:"🎡", name:"Roulette — Table 2" },
        { href:"games/blackjack.html?table=1", gc:"#c9a227", icon:"🃏", name:"Blackjack — Table 1" },
        { href:"games/blackjack.html?table=2", gc:"#c9a227", icon:"🃏", name:"Blackjack — Table 2" },
        { href:"games/crash.html", gc:"#b3121a", icon:"📈", name:"Ascension Fulgurante" },
      ].map(g => locked
        ? `<div class="game-tile" style="--gc:${g.gc};opacity:.45;cursor:not-allowed;" title="Carte ${suspended?'suspendue':'expirée'}"><div class="gi">${g.icon}</div><div class="gn">${g.name}</div></div>`
        : `<a class="game-tile" href="${g.href}" style="--gc:${g.gc}"><div class="gi">${g.icon}</div><div class="gn">${g.name}</div></a>`
      ).join('')}
    </div>

    <div class="panel" style="margin-top:28px;">
      <div class="panel-title">📜 Historique</div>
      <div id="cardTxLog"><div class="loader"></div></div>
    </div>
  `;

  document.getElementById("btnLock").addEventListener("click", () => { clearPlayerSession(); renderUnlock(); });
  staggerIn('.game-tile');
  const balanceNumEl = cardView.querySelector('.cv-balance .token-num');
  if(balanceNumEl) countUp(balanceNumEl, 0, card.balance, { duration: 900 });
  document.getElementById("statTotalWagered").textContent = (card.totalWagered || 0).toLocaleString('fr-FR');

  const allTxs = await cardTransactions(card.id, 500);
  renderStats(allTxs);
  const txs = allTxs.slice(0, 25);
  const typeColor = { depot:'#1fae7c', retrait:'#c9282f', mise:'#c9a227', gain:'#1fae7c', perte:'#c9282f' };
  const el = document.getElementById("cardTxLog");
  if(!txs.length){ el.innerHTML = `<div class="empty-state"><p>Aucune transaction pour l'instant.</p></div>`; }
  else{
    el.innerHTML = `<div class="log-list">${txs.map(t => {
      const c = typeColor[t.type] || '#c9a227';
      const date = t.createdAt?.toDate ? t.createdAt.toDate().toLocaleString('fr-FR') : '—';
      return `<div class="log-entry" style="--lc:${c}">
        <span class="log-action">${t.type}</span>
        <span class="log-detail">${t.amount>0?'+':''}${t.amount} 🪙 (${formatYen(tokensToYen(t.amount))}) ${t.note?('— '+t.note):''} ${t.staffName?('· '+t.staffName):''}</span>
        <span class="log-date">${date}</span>
      </div>`;
    }).join('')}</div>`;
  }
}

if(getPlayerSession()) renderCard(); else renderUnlock();
</script>
</body>
</html>
