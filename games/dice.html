<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lancer de Dés — Sphère de l'Intendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Noto+Sans+JP:wght@200;300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
.wrap{max-width:520px;margin:0 auto;padding:30px 20px 80px;position:relative;z-index:2;}
.gtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:10px;flex-wrap:wrap;}
.balance-pill{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold2);border:1px solid var(--border-h);padding:8px 16px;border-radius:20px;background:rgba(201,162,39,.05);}
.dice-stage{display:flex;align-items:center;justify-content:center;height:160px;}
.die{width:100px;height:100px;border-radius:16px;background:linear-gradient(150deg,#1a0a02,#0a0402);border:2px solid rgba(201,162,39,.4);
  display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:3rem;font-weight:900;color:var(--gold2);
  box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(201,162,39,.15);transition:transform .1s;}
.die.rolling{animation:diceShake .8s ease-in-out;}
@keyframes diceShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg) scale(1.05)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
.num-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0;}
.num-btn{aspect-ratio:1;border-radius:8px;border:2px solid rgba(255,255,255,.08);background:var(--panel);
  font-family:'Cinzel',serif;font-size:1.3rem;font-weight:900;color:var(--text-muted);transition:.2s;}
.num-btn.selected{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.1);box-shadow:0 0 18px rgba(201,162,39,.2);}
.bet-row{display:flex;gap:10px;margin-top:8px;}
.bet-row .form-group{flex:1;margin-bottom:0;}
.result-banner{text-align:center;margin-top:18px;padding:14px;border-radius:8px;font-family:'Cinzel',serif;letter-spacing:2px;display:none;}
.result-banner.win{display:block;background:rgba(31,174,124,.12);border:1px solid rgba(31,174,124,.35);color:#5ee0af;}
.result-banner.loss{display:block;background:rgba(201,40,47,.12);border:1px solid rgba(201,40,47,.35);color:#ff8a8a;}
</style>
</head>
<body>
<div class="bg-fx"></div><canvas id="embers"></canvas><div id="grain"></div><div id="vignette"></div>
<div class="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"></div>
<div id="toast-container"></div>

<div class="wrap">
  <div class="gtop">
    <a href="../carte.html" class="btn btn-ghost btn-sm">← Ma Carte</a>
    <div class="balance-pill yen-tag" id="balancePill">—</div>
  </div>
  <div class="page-title" style="font-size:1.15rem;padding-bottom:8px;">Lancer de Dés</div>
  <div class="page-sub">Devine le bon chiffre — Mise à 5×</div>

  <div class="panel">
    <div class="dice-stage"><div class="die" id="die">?</div></div>
    <div class="num-grid" id="numGrid"></div>
    <div class="bet-row">
      <div class="form-group"><label class="form-label">Mise (¥)</label><input class="form-input" id="betAmount" type="number" min="1" value="20"></div>
    </div>
    <button class="btn btn-solid btn-block btn-lg" id="btnPlay" style="margin-top:16px;">Lancer les Dés</button>
    <div class="result-banner" id="resultBanner"></div>
  </div>
</div>

<script type="module">
import { initFx } from "../assets/js/fx.js";
import { toast } from "../assets/js/toast.js";
import { requirePlayerCard } from "../assets/js/playerSession.js";
import { getCard, adjustBalance, isExpired } from "../assets/js/cards.js";

initFx();
const session = requirePlayerCard();
let choice = null;
let playing = false;

const grid = document.getElementById("numGrid");
for(let n=1;n<=6;n++){
  const b = document.createElement("button");
  b.className = "num-btn"; b.textContent = n; b.dataset.n = n;
  b.addEventListener("click", () => {
    document.querySelectorAll(".num-btn").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected"); choice = n;
  });
  grid.appendChild(b);
}

async function refreshBalance(){
  const card = await getCard(session.id);
  document.getElementById("balancePill").textContent = "¥ " + (card?.balance ?? 0);
}
refreshBalance();

document.getElementById("btnPlay").addEventListener("click", async () => {
  if(playing) return;
  const bet = parseInt(document.getElementById("betAmount").value, 10);
  if(!choice) return toast("Choisis un chiffre de 1 à 6.", "warn");
  if(!bet || bet <= 0) return toast("Mise invalide.", "warn");
  const card = await getCard(session.id);
  if(isExpired(card)) return toast("Carte expirée — repasse à la caisse.", "error");
  if(card.balance < bet) return toast("Solde insuffisant.", "warn");

  playing = true;
  document.getElementById("resultBanner").className = "result-banner";
  const die = document.getElementById("die");
  die.classList.remove("rolling"); void die.offsetWidth; die.classList.add("rolling");

  const roll = Math.floor(Math.random()*6) + 1;
  const win = roll === choice;
  const net = win ? bet * 4 : -bet; // 5x payout total (mise conservée + 4x)

  setTimeout(async () => {
    die.textContent = roll;
    try{
      const balanceAfter = await adjustBalance({
        cardId: session.id, amount: net, type: win ? "gain" : "perte",
        gameId: "dice", note: `Mise ¥${bet} sur ${choice}, résultat ${roll}`
      });
      const banner = document.getElementById("resultBanner");
      banner.classList.add(win ? "win" : "loss");
      banner.textContent = win ? `✓ Gagné ! +¥${net} — Solde : ¥${balanceAfter}` : `✗ Perdu — ¥${bet} — Solde : ¥${balanceAfter}`;
      document.getElementById("balancePill").textContent = "¥ " + balanceAfter;
    }catch(e){ toast(e.message, "error"); }
    playing = false;
  }, 800);
});
</script>
</body>
</html>
