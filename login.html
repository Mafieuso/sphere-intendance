<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Staff — Sphère de l'Intendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Noto+Sans+JP:wght@200;300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2;}
.login-panel{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--gold);
  border-radius:14px;padding:38px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fadeUp .5s ease-out both;}
.login-crest{font-size:1.4rem;color:rgba(201,162,39,.7);margin-bottom:14px;}
.login-title{font-family:'Cinzel Decorative',serif;font-size:1.3rem;letter-spacing:3px;
  background:linear-gradient(135deg,#8a6a10,#f5d870,#c9a227,#f0e890,#a07820);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% auto;animation:shimmer 4s linear infinite;margin-bottom:6px;}
.login-sub{font-size:.68rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:30px;}
.pin-input{text-align:center;letter-spacing:4px;font-family:'Cinzel',serif;font-size:1rem;}
.login-back{display:block;margin-top:18px;font-size:.62rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.login-back:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="bg-fx"></div>
<canvas id="embers"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div class="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"></div>
<div id="toast-container"></div>

<div class="login-wrap">
  <div class="login-panel">
    <div class="login-crest">⛩</div>
    <div class="login-title">Accès Staff</div>
    <div class="login-sub">Sphère de l'Intendance</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Code secret (PIN)</label>
        <input class="form-input pin-input" id="pinInput" type="password" placeholder="••••••••" autocomplete="off" required autofocus>
      </div>
      <button type="submit" class="btn btn-solid btn-block btn-lg" id="loginBtn">Entrer</button>
    </form>

    <form id="pinSetupForm" style="display:none;">
      <p style="font-size:.7rem;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">
        Ton code est temporaire. Choisis ton propre code secret avant de continuer.
      </p>
      <div class="form-group">
        <label class="form-label">Nouveau code (min. 4 caractères)</label>
        <input class="form-input pin-input" id="newPinInput" type="password" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirme le code</label>
        <input class="form-input pin-input" id="confirmPinInput" type="password" autocomplete="off" required>
      </div>
      <button type="submit" class="btn btn-solid btn-block btn-lg" id="pinSetupBtn">Valider mon code</button>
    </form>

    <a class="login-back" href="index.html">← Retour à l'accueil</a>
  </div>
</div>

<script type="module">
import { initFx } from "./assets/js/fx.js";
import { initUiFx } from "./assets/js/uiFx.js";
import { toast } from "./assets/js/toast.js";
import { loginWithPin, roleLabel, getSession, needsPinSetup, setPermanentPin } from "./assets/js/session.js";

initFx();
initUiFx({ tilt: false });

// Déjà connecté ? on redirige direct.
const params = new URLSearchParams(location.search);
const next = params.get("next");
const existing = getSession();
if(existing && existing.role){
  location.href = next || defaultPageFor(existing.role);
}

function defaultPageFor(role){
  if(role === "hote") return "hote.html";
  if(role === "croupier") return "croupier.html";
  if(role === "admin") return "admin.html";
  return "index.html";
}

let pendingStaff = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const pin = document.getElementById("pinInput").value;
  if(!pin) return;
  btn.disabled = true; btn.textContent = "Vérification…";
  try{
    const staff = await loginWithPin(pin);
    if(!staff){
      toast("Code secret invalide.", "error");
      btn.disabled = false; btn.textContent = "Entrer";
      return;
    }
    if(needsPinSetup(staff)){
      pendingStaff = staff;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("pinSetupForm").style.display = "block";
      toast("Code temporaire — configure ton propre code.", "info");
      return;
    }
    toast(`Bienvenue, ${staff.name} (${roleLabel(staff.role)})`, "success");
    setTimeout(() => { location.href = next || defaultPageFor(staff.role); }, 600);
  }catch(err){
    console.error(err);
    toast("Erreur de connexion à la base.", "error");
    btn.disabled = false; btn.textContent = "Entrer";
  }
});

document.getElementById("pinSetupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if(!pendingStaff) return;
  const btn = document.getElementById("pinSetupBtn");
  const newPin = document.getElementById("newPinInput").value;
  const confirmPin = document.getElementById("confirmPinInput").value;
  if(newPin !== confirmPin) return toast("Les deux codes ne correspondent pas.", "warn");
  btn.disabled = true; btn.textContent = "Configuration…";
  try{
    await setPermanentPin(pendingStaff.id, newPin);
    toast(`Code configuré — bienvenue, ${pendingStaff.name} !`, "success");
    setTimeout(() => { location.href = next || defaultPageFor(pendingStaff.role); }, 600);
  }catch(err){
    toast(err.message || "Erreur lors de la configuration.", "error");
    btn.disabled = false; btn.textContent = "Valider mon code";
  }
});
</script>
</body>
</html>
