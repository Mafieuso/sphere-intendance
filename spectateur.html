<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salle en Direct — Sphère de l'Intendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Noto+Sans+JP:wght@200;300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:2;}
.tables-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px;}
.table-card{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--gc,var(--gold));border-radius:12px;
  padding:22px 18px;text-align:center;transition:.25s;}
.table-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.6);border-color:var(--gc,var(--gold));}
.table-card .ti{font-size:1.8rem;margin-bottom:8px;}
.table-card .tn{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:1px;color:var(--text);}
</style>
</head>
<body>
<div class="bg-fx"></div><canvas id="embers"></canvas><div id="grain"></div><div id="vignette"></div>
<div class="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"></div>
<div id="toast-container"></div>

<div class="wrap">
  <a href="index.html" class="btn btn-ghost btn-sm" style="margin-bottom:20px;display:inline-flex;">← Accueil</a>
  <div class="page-title" style="font-size:1.2rem;">👁 Salle en Direct</div>
  <div class="page-sub">Observer les tables sans y participer</div>

  <div class="tables-grid">
    <a class="table-card" href="games/roulette.html" style="--gc:#b3121a"><div class="ti">🎡</div><div class="tn">Roulette</div></a>
    <a class="table-card" href="games/blackjack.html" style="--gc:#c9a227"><div class="ti">🃏</div><div class="tn">Blackjack</div></a>
    <a class="table-card" href="games/crash.html" style="--gc:#1fae7c"><div class="ti">📈</div><div class="tn">Ascension Démoniaque</div></a>
  </div>

  <div class="panel">
    <div class="panel-title">📜 Activité Récente de la Maison</div>
    <div id="liveLog"><div class="loader"></div></div>
  </div>
</div>

<script type="module">
import { initFx } from "./assets/js/fx.js";
import { db, collection, query, orderBy, limit, onSnapshot } from "./assets/js/firebase-init.js";
initFx();

const q = query(collection(db, "logs"), orderBy("createdAt", "desc"), limit(25));
onSnapshot(q, (snap) => {
  const el = document.getElementById("liveLog");
  if(snap.empty){ el.innerHTML = `<div class="empty-state"><p>Aucune activité.</p></div>`; return; }
  el.innerHTML = `<div class="log-list">${snap.docs.map(d => {
    const l = d.data();
    const date = l.createdAt?.toDate ? l.createdAt.toDate().toLocaleString('fr-FR') : '—';
    return `<div class="log-entry">
      <span class="log-action">${l.action}</span>
      <span class="log-detail"><strong>${l.playerName||l.staffName||'—'}</strong> ${l.detail?('— '+l.detail):''}</span>
      <span class="log-date">${date}</span>
    </div>`;
  }).join('')}</div>`;
});
</script>
</body>
</html>
