<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salle en Direct — Sphère de l'Intendance</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=Noto+Sans+JP:wght@200;300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:2;}
.tables-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px;}
.table-card{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--gc,var(--gold));border-radius:12px;
  padding:22px 18px;text-align:center;transition:.25s;}
.table-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.6);border-color:var(--gc,var(--gold));}
.table-card .ti{font-size:1.8rem;margin-bottom:8px;}
.table-card .tn{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:1px;color:var(--text);}
.leaderboard-list{display:flex;flex-direction:column;gap:10px;}
.leaderboard-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);transition:.2s;}
.leaderboard-row.rank-1{border-color:rgba(201,162,39,.4);background:linear-gradient(160deg,rgba(201,162,39,.1),rgba(201,162,39,.02));box-shadow:0 0 24px rgba(201,162,39,.12);}
.leaderboard-row.rank-2{border-color:rgba(200,200,210,.25);}
.leaderboard-row.rank-3{border-color:rgba(180,120,60,.3);}
.lb-medal{font-size:1.4rem;flex-shrink:0;}
.lb-name{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:1px;color:var(--text);flex:1;}
.lb-amount{font-family:'Cinzel',serif;font-size:.82rem;color:var(--gold2);font-weight:700;}
</style>
</head>
<body>
<div class="bg-fx"></div><canvas id="embers"></canvas><div id="grain"></div><div id="vignette"></div>
<div class="particles" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"></div>
<div id="toast-container"></div>

<div class="wrap">
  <a href="index.html" class="btn btn-ghost btn-sm" style="margin-bottom:20px;display:inline-flex;">← Accueil</a>
  <div class="page-title" style="font-size:1.2rem;">👁 Salle en Direct</div>
  <div class="page-sub">Observer les tables sans y participer</div>

  <div class="tables-grid">
    <a class="table-card" href="games/roulette.html" style="--gc:#b3121a"><div class="ti">🎡</div><div class="tn">Roulette</div></a>
    <a class="table-card" href="games/blackjack.html" style="--gc:#c9a227"><div class="ti">🃏</div><div class="tn">Blackjack</div></a>
    <a class="table-card" href="games/crash.html" style="--gc:#1fae7c"><div class="ti">📈</div><div class="tn">Ascension Fulgurante</div></a>
  </div>

  <div class="panel">
    <div class="panel-title">🏆 Classement — Plus Gros Gains</div>
    <div id="leaderboard"><div class="loader"></div></div>
  </div>
</div>

<script type="module">
import { initFx } from "./assets/js/fx.js";
import { initUiFx, staggerIn } from "./assets/js/uiFx.js";
import { db, collection, query, orderBy, limit, onSnapshot } from "./assets/js/firebase-init.js";
import { formatYen, tokensToYen } from "./assets/js/economy.js";
initFx();
initUiFx();
staggerIn('.table-card');

const MEDALS = ["🥇","🥈","🥉"];
/* Bornée aux 800 transactions les plus récentes, tous types confondus (quota de
   lectures Firestore — un filtre "type == gain" combiné à un tri par date
   nécessiterait un index composite). Le filtre "gain" se fait côté client :
   le classement reste représentatif sans relire tout l'historique à chaque visite. */
const gainsQ = query(collection(db, "transactions"), orderBy("createdAt","desc"), limit(800));
onSnapshot(gainsQ, (snap) => {
  const totals = new Map();
  snap.docs.forEach(d => {
    const t = d.data();
    if(t.type !== "gain") return;
    const entry = totals.get(t.cardId) || { playerName: t.playerName, total: 0 };
    entry.total += (t.amount || 0);
    entry.playerName = t.playerName;
    totals.set(t.cardId, entry);
  });
  const top = [...totals.values()].sort((a,b) => b.total - a.total).slice(0, 3);
  const el = document.getElementById("leaderboard");
  if(!top.length){ el.innerHTML = `<div class="empty-state"><p>Aucun gain enregistré pour l'instant.</p></div>`; return; }
  el.innerHTML = `<div class="leaderboard-list">${top.map((w,i) => `
    <div class="leaderboard-row rank-${i+1}">
      <span class="lb-medal">${MEDALS[i]}</span>
      <span class="lb-name">${w.playerName}</span>
      <span class="lb-amount">${formatYen(tokensToYen(w.total))}</span>
    </div>`).join('')}</div>`;
});
</script>
</body>
</html>
